[project]
name = "uv-proxy"
version = "0.1.0"
description = "A fast, liquid-smooth HTTP proxy playground powered by uv and httpx."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "httpx[http2]>=0.28.1,<1.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.3,<1.0.0",
    "ruff>=0.9.4,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uv_proxy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
